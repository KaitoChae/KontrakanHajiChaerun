<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">Haji Chaerun 出租住宅位置图</title>
<desc id="desc">示意图按照 Rancaekek、Cileunyi 与 Jatinangor 一带的主要道路关系重新绘制，并显示 Rancaekek 车站与 Haji Chaerun 出租住宅距离很近。</desc>
<style>
  .pinPulseInner{transform-box:fill-box;transform-origin:center;animation:pinPulse 2.4s ease-in-out infinite}
  .mapFloat1{animation:mapFloat1 7s ease-in-out infinite}
  .mapFloat2{animation:mapFloat2 8s ease-in-out infinite}
  .miniTrainInner{transform-box:fill-box;transform-origin:center;animation:miniTrain 8s ease-in-out infinite}
  .whooshGlow{animation:whooshGlow 1.6s ease-in-out infinite}
  @keyframes pinPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
  @keyframes mapFloat1{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes mapFloat2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
  @keyframes miniTrain{0%,100%{transform:translateX(0)}50%{transform:translateX(105px)}}
  @keyframes whooshGlow{0%,100%{opacity:.72}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){.pinPulseInner,.mapFloat1,.mapFloat2,.miniTrainInner,.whooshGlow{animation:none!important}}
</style>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#edf6ef"/></linearGradient>
 <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#203b31" flood-opacity=".13"/></filter>
</defs>
<rect width="1600" height="920" rx="54" fill="url(#bg)"/>

<!-- green areas and waterways, placed to echo the real area without clutter -->
<g class="mapFloat1" fill="#d8efdc"><ellipse cx="205" cy="170" rx="155" ry="88"/><ellipse cx="1320" cy="110" rx="205" ry="108"/></g>
<g class="mapFloat2" fill="#dcefe0"><ellipse cx="1340" cy="705" rx="190" ry="108"/><ellipse cx="330" cy="775" rx="175" ry="92"/></g>
<path d="M1110 0 C1160 130 1135 250 1060 350 S1030 485 1095 575" fill="none" stroke="#99d9ea" stroke-width="13" stroke-linecap="round"/>
<path d="M30 210 C260 175 425 220 600 205 S910 120 1540 195" fill="none" stroke="#afe1ef" stroke-width="10" stroke-linecap="round"/>

<!-- secondary streets -->
<g fill="none" stroke-linecap="round">
 <path d="M170 40 C330 145 430 255 520 350 S690 555 930 760" stroke="#eadfc9" stroke-width="44"/><path d="M170 40 C330 145 430 255 520 350 S690 555 930 760" stroke="#fff" stroke-width="27"/>
 <path d="M610 45 C655 180 670 315 650 455 S625 650 610 870" stroke="#eadfc9" stroke-width="40"/><path d="M610 45 C655 180 670 315 650 455 S625 650 610 870" stroke="#fff" stroke-width="24"/>
 <path d="M900 55 C925 170 970 275 1000 390 S1065 605 1210 820" stroke="#eadfc9" stroke-width="34"/><path d="M900 55 C925 170 970 275 1000 390 S1065 605 1210 820" stroke="#fff" stroke-width="20"/>
 <path d="M35 565 C300 535 485 530 690 545 S1075 555 1560 595" stroke="#eadfc9" stroke-width="40"/><path d="M35 565 C300 535 485 530 690 545 S1075 555 1560 595" stroke="#fff" stroke-width="24"/>
</g>

<!-- main national road: west / Cileunyi to southeast Rancaekek, matching the Google Maps orientation -->
<path d="M-30 292 C180 305 355 315 495 350 C615 380 685 455 790 520 C980 635 1215 675 1630 785" fill="none" stroke="#7e98b8" stroke-width="32" stroke-linecap="round"/>
<path d="M-30 292 C180 305 355 315 495 350 C615 380 685 455 790 520 C980 635 1215 675 1630 785" fill="none" stroke="#cbd6e2" stroke-width="16" stroke-linecap="round"/>
<path d="M-20 283 C185 296 360 306 500 341 C620 371 690 446 795 511 C985 626 1220 666 1620 776" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="13 18"/>

<!-- Jatinangor branch from the Cileunyi junction -->
<path d="M470 352 C545 318 610 272 700 242 C875 184 1050 160 1255 168 S1450 188 1600 215" fill="none" stroke="#7e98b8" stroke-width="30" stroke-linecap="round"/>
<path d="M470 352 C545 318 610 272 700 242 C875 184 1050 160 1255 168 S1450 188 1600 215" fill="none" stroke="#cbd6e2" stroke-width="15" stroke-linecap="round"/>
<path d="M480 342 C555 308 620 262 710 232 C885 174 1060 150 1265 158 S1450 178 1590 205" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="13 18"/>

<!-- Cileunyi interchange cue -->
<path d="M410 320 C455 280 520 285 545 330 C565 365 540 405 495 408 C450 411 420 382 438 350" fill="none" stroke="#7e98b8" stroke-width="15" stroke-linecap="round" opacity=".85"/>

<!-- CILEUNYI TOLL LABEL: corrected from the earlier Cisumdawu wording -->
<g transform="translate(615 382) rotate(31)" font-family="Arial,sans-serif">
 <rect x="-12" y="-23" width="175" height="34" rx="14" fill="#fff" fill-opacity=".88"/>
 <text x="0" y="0" font-size="15" font-weight="900" fill="#5f7898">CILEUNYI 收费公路</text>
</g>

<!-- conventional railway through Rancaekek -->
<path d="M80 704 C335 700 520 681 685 654 S1030 615 1515 602" fill="none" stroke="#304a40" stroke-width="8" stroke-linecap="round"/>
<g stroke="#304a40" stroke-width="3">
 <path d="M110 702v19"/><path d="M155 699v19"/><path d="M200 696v19"/><path d="M245 693v19"/><path d="M290 690v19"/><path d="M335 687v19"/><path d="M380 684v19"/><path d="M425 680v19"/><path d="M470 677v19"/><path d="M515 674v19"/><path d="M560 671v19"/><path d="M605 668v19"/><path d="M650 665v19"/><path d="M695 661v19"/><path d="M740 658v19"/><path d="M785 655v19"/><path d="M830 652v19"/><path d="M875 649v19"/><path d="M920 646v19"/><path d="M965 643v19"/><path d="M1010 639v19"/><path d="M1055 636v19"/><path d="M1100 633v19"/><path d="M1145 630v19"/><path d="M1190 627v19"/><path d="M1235 624v19"/><path d="M1280 621v19"/><path d="M1325 617v19"/><path d="M1370 614v19"/><path d="M1415 611v19"/><path d="M1460 608v19"/>
</g>
<text x="1180" y="590" font-family="Arial,sans-serif" font-size="14" font-weight="900" fill="#304a40" opacity=".68">铁路</text>

<!-- Whoosh direction toward Tegalluar -->
<path id="whooshRoute" d="M70 790 C235 760 360 710 485 632" fill="none" stroke="#e75d52" stroke-width="11" stroke-linecap="round"/>
<path id="whooshMotionPath" d="M485 632 C360 710 235 760 70 790" fill="none" stroke="none"/>
<path d="M70 790 C235 760 360 710 485 632" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="11 13"/>

<!-- locality names -->
<g font-family="Arial,sans-serif" font-weight="900" fill="#173a2d" opacity=".36">
 <text x="165" y="250" font-size="27">CILEUNYI</text>
 <text x="705" y="815" font-size="38">RANCAEKEK</text>
 <text x="1160" y="300" font-size="40">JATINANGOR</text>
</g>
<text x="860" y="135" font-family="Arial,sans-serif" font-size="13" font-weight="900" fill="#587066" opacity=".7">前往 JATINANGOR</text>

<!-- HOME: intentionally placed just southwest of the station -->
<g transform="translate(660 550)" filter="url(#sh)">
 <circle class="pinPulseInner" r="52" fill="#ff6653" opacity=".16"/>
 <path d="M0 -64C-36-64-64-36-64 0c0 47 64 108 64 108S64 47 64 0C64-36 36-64 0-64Z" fill="#ff6653"/>
 <circle r="34" fill="#fff8f1"/>
 <path d="M-22 4 0-17 22 4v25h-44Z" fill="#ffc4b6" stroke="#18392d" stroke-width="4"/>
 <path d="M-27 5 0-23 27 5" fill="none" stroke="#18392d" stroke-width="5"/>
 <rect x="-6" y="12" width="12" height="17" rx="2" fill="#18392d"/>
</g>
<g transform="translate(495 690)" filter="url(#sh)">
 <rect width="330" height="70" rx="23" fill="#18392d"/>
 <text x="165" y="27" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#f5d77a">出租住宅位置</text>
 <text x="165" y="52" text-anchor="middle" font-family="Arial" font-size="20" font-weight="900" fill="#fff">HAJI CHAERUN</text>
</g>

<!-- Station point and offset label: very close to home, with no overlap -->
<g transform="translate(682 654)">
 <circle r="13" fill="#fff" stroke="#18392d" stroke-width="4"/>
 <circle r="5" fill="#63b9d0"/>
</g>
<path d="M695 650 C715 642 725 634 742 627" fill="none" stroke="#18392d" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(735 585)" font-family="Arial,sans-serif" filter="url(#sh)">
 <rect width="320" height="90" rx="24" fill="#fff" stroke="#18392d" stroke-width="4"/>
 <circle cx="47" cy="45" r="31" fill="#f5d77a"/>
 <text x="47" y="56" text-anchor="middle" font-size="30">🚆</text>
 <text x="95" y="35" font-size="19" font-weight="900" fill="#17392d">Rancaekek 车站</text>
 <text x="95" y="63" font-size="16" font-weight="900" fill="#ff6653">非常近</text>
</g>

<!-- Landmark cards placed according to the real west-to-east / north-to-south relationship -->
<g font-family="Arial,sans-serif" filter="url(#sh)">
 <g transform="translate(700 95)"><rect width="245" height="82" rx="22" fill="#fff" stroke="#82689d" stroke-width="4"/><circle cx="43" cy="41" r="29" fill="#eee6f6"/><text x="43" y="51" text-anchor="middle" font-size="29">🏛</text><text x="86" y="34" font-size="20" font-weight="900" fill="#17392d">IPDN</text><text x="86" y="58" font-size="14" fill="#52685d">Jatinangor</text></g>
 <g transform="translate(980 55)"><rect width="245" height="82" rx="22" fill="#fff" stroke="#4a809f" stroke-width="4"/><circle cx="43" cy="41" r="29" fill="#e4edf5"/><text x="43" y="51" text-anchor="middle" font-size="29">🎓</text><text x="86" y="34" font-size="20" font-weight="900" fill="#17392d">ITB</text><text x="86" y="58" font-size="14" fill="#52685d">Jatinangor</text></g>
 <g transform="translate(1280 75)"><rect width="235" height="82" rx="22" fill="#fff" stroke="#c77e55" stroke-width="4"/><circle cx="43" cy="41" r="29" fill="#f7e6db"/><text x="43" y="51" text-anchor="middle" font-size="29">🎓</text><text x="86" y="34" font-size="20" font-weight="900" fill="#17392d">UNPAD</text><text x="86" y="58" font-size="14" fill="#52685d">Jatinangor</text></g>
 <g transform="translate(1005 205)"><rect width="245" height="82" rx="22" fill="#fff" stroke="#6c8f4b" stroke-width="4"/><circle cx="43" cy="41" r="29" fill="#eaf2df"/><text x="43" y="51" text-anchor="middle" font-size="29">🛍</text><text x="86" y="34" font-size="20" font-weight="900" fill="#17392d">JATOS</text><text x="86" y="58" font-size="13" fill="#52685d">Jatinangor Town Square</text></g>
 <g transform="translate(1255 330)"><rect width="285" height="82" rx="22" fill="#fff" stroke="#4f96a3" stroke-width="4"/><circle cx="43" cy="41" r="29" fill="#e2f3f6"/><text x="43" y="51" text-anchor="middle" font-size="28">🏊</text><text x="86" y="34" font-size="17" font-weight="900" fill="#17392d">Lalagoon Waterpark</text><text x="86" y="58" font-size="14" fill="#52685d">Jatinangor</text></g>
 <g transform="translate(60 530)"><rect width="345" height="96" rx="24" fill="#fff" stroke="#e75d52" stroke-width="4"/><circle cx="47" cy="48" r="32" fill="#ffe8e3"/><text x="47" y="58" text-anchor="middle" font-size="31">🚄</text><text x="96" y="35" font-size="18" font-weight="900" fill="#17392d">Tegalluar Summarecon</text><text x="96" y="64" font-size="21" font-weight="900" fill="#267650">Whoosh / KCIC</text></g>
</g>

<!-- animated Whoosh-style high-speed train. The pointed nose faces +X,
     so rotate="auto" keeps the nose facing the actual direction of travel. -->
<g class="whooshGlow" aria-hidden="true">
 <g transform="translate(-61 -16)" filter="url(#sh)">
  <!-- subtle speed streaks behind the train -->
  <path d="M-16 11 H10" stroke="#e75d52" stroke-width="3" stroke-linecap="round" opacity=".45"/>
  <path d="M-11 18 H8" stroke="#e75d52" stroke-width="2.5" stroke-linecap="round" opacity=".28"/>
  <!-- streamlined white body with a long Whoosh-like nose -->
  <path d="M4 7 C24 2 61 1 84 3 C100 4 113 9 122 16 C113 23 100 28 84 29 C60 32 25 30 5 25 C1 22 0 11 4 7Z" fill="#fff" stroke="#d8473b" stroke-width="2.7"/>
  <!-- dark windshield near the pointed nose -->
  <path d="M88 5 C101 6 111 10 119 16 C111 16 101 15 92 14Z" fill="#263e49"/>
  <!-- continuous red accent stripe characteristic of the train -->
  <path d="M14 22 C42 25 72 24 99 20" fill="none" stroke="#e94f43" stroke-width="4" stroke-linecap="round"/>
  <!-- passenger windows -->
  <rect x="31" y="7" width="13" height="7" rx="2.5" fill="#86cfe1"/>
  <rect x="49" y="6.5" width="13" height="7" rx="2.5" fill="#86cfe1"/>
  <rect x="67" y="6" width="12" height="7" rx="2.5" fill="#86cfe1"/>
  <text x="47" y="20" font-family="Arial,sans-serif" font-size="6.5" font-weight="900" fill="#213c34" letter-spacing=".8">WHOOSH</text>
 </g>
 <animateMotion dur="4.6s" repeatCount="indefinite" rotate="auto" calcMode="paced">
  <mpath href="#whooshMotionPath"/>
 </animateMotion>
</g>

<!-- cute moving train kept on the actual rail line -->
<g transform="translate(430 645)"><g class="miniTrainInner" transform="scale(1.15)">
 <rect x="0" y="0" width="52" height="27" rx="8" fill="#fff" stroke="#18392d" stroke-width="3"/><rect x="8" y="6" width="12" height="8" rx="2" fill="#9dd9ea"/><rect x="25" y="6" width="12" height="8" rx="2" fill="#9dd9ea"/><circle cx="13" cy="30" r="5" fill="#18392d"/><circle cx="39" cy="30" r="5" fill="#18392d"/>
</g></g>

<g transform="translate(1470 805)"><circle cx="42" cy="42" r="38" fill="#fff" stroke="#18392d" stroke-width="3"/><path d="M42 8 51 43 42 76 33 43Z" fill="#ff6653"/><text x="42" y="3" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#18392d">N</text></g>
</svg>